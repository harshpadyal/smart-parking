<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parking Slot Availability</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
    .glass-box {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .loading {
      opacity: 0.7;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

  <!-- Navbar -->
  <div class="sticky top-0 z-50 bg-black/30 backdrop-blur-md px-4 py-3 flex justify-between items-center shadow-lg">
    <h1 class="text-xl font-bold text-cyan-400">Smart Parking</h1>
    <nav class="space-x-4">
      <a href="/dashboard" class="text-cyan-400 font-semibold">Available Spots</a>
      <a href="/logout" class="hover:text-cyan-300 transition">Logout</a>
    </nav>
  </div>

  <!-- Main Section -->
  <main class="flex-grow p-6 flex flex-col items-center justify-center">
    <h2 class="text-4xl font-bold text-cyan-400 mb-6">Parking Slot Availability</h2>
    <p class="mb-6 text-gray-300">Green = Empty, Red = Full (Live View)</p>
    <button id="refreshButton" class="mb-6 px-4 py-2 bg-cyan-500 text-white rounded-lg hover:bg-cyan-600">Refresh</button>
    <p id="statusMessage" class="mb-4 text-gray-400 text-sm">Last updated: Never</p>
    <div id="slotsContainer" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-10 w-full max-w-3xl"></div>
  </main>

  <!-- Footer -->
  <footer class="text-sm text-gray-400 text-center py-6">
    © 2025 Smart Parking | Developed by VESIT Team
  </footer>

  <!-- Dynamic Logic Script -->
  <script>
    let lastAlertTime = 0;
    const alertDebounce = 10000;
    let pollingInterval = null;
    const API_URL = "http://127.0.0.1:5001/api/available-spots";
    const USE_MOCK = false;

    async function fetchWithRetry(url, options, retries = 3, delay = 1000) {
      for (let i = 0; i < retries; i++) {
        try {
          const res = await fetch(url, options);
          if (res.ok) return res;
          const errorText = await res.text();
          throw new Error(`Fetch failed: ${res.status} ${res.statusText} - ${errorText}`);
        } catch (err) {
          if (i === retries - 1) {
            console.error(`Final fetch attempt failed for ${url}:`, err);
            throw err;
          }
          console.warn(`Retry ${i + 1}/${retries} for ${url} after ${delay}ms: ${err.message}`);
          await new Promise(resolve => setTimeout(resolve, delay));
        }
      }
    }

    async function checkBackendHealth() {
      try {
        const healthUrl = API_URL.replace("/api/available-spots", "/health");
        const res = await fetch(healthUrl);
        const responseText = await res.text();
        console.log(`Backend health check for ${healthUrl}: ${res.status} ${responseText}`);
        return res.ok;
      } catch (err) {
        console.error(`Backend health check failed for ${healthUrl}: ${err.message}`);
        return false;
      }
    }

    async function loadSlots() {
      console.log("Starting loadSlots at", new Date().toISOString(), `Using ${API_URL}`);
      const slotsContainer = document.getElementById("slotsContainer");
      const statusMessage = document.getElementById("statusMessage");
      slotsContainer.classList.add("loading");
      
      try {
        let data;
        if (USE_MOCK) {
          data = { booked: [1, 3, 5] };
          console.log("Using mock data:", data);
        } else {
          const startTime = performance.now();
          const res = await fetchWithRetry(API_URL, {
            method: "GET",
            headers: { "Content-Type": "application/json" }
          }, 3, 1000);
          const fetchTime = performance.now() - startTime;
          console.log("Fetch status:", res.status, `Took ${fetchTime.toFixed(2)}ms`);
          data = await res.json();
          console.log("Fetched data:", data);
        }

        if (!data.booked) throw new Error("Invalid response: booked array missing");
        const { booked } = data;

        slotsContainer.innerHTML = "";
        for (let i = 1; i <= 10; i++) {
          console.log(`Creating slot ${i}, booked: ${booked.includes(i)}`);
          const div = document.createElement("div");
          div.className = `slot glass-box w-20 h-20 rounded flex items-center justify-center text-lg font-bold transition duration-300 ${
            booked.includes(i) ? "bg-[#921212]" : "bg-[#1b7613]"
          }`;
          div.innerText = `Slot ${i}`;
          div.id = `slot${i}`;
          slotsContainer.appendChild(div);
        }
        console.log("Slots rendered");
        statusMessage.textContent = `Last updated: ${new Date().toLocaleTimeString()} via ${USE_MOCK ? "mock data" : API_URL}`;
      } catch (err) {
        console.error("Failed to load slots:", err.message, err.stack);
        const now = Date.now();
        if (now - lastAlertTime >= alertDebounce) {
          alert(`Error loading parking slots: ${err.message}. Is the admin backend running on 127.0.0.1:5001?`);
          lastAlertTime = now;
        }
        statusMessage.textContent = `Last updated: Failed at ${new Date().toLocaleTimeString()} via ${API_URL}`;
      } finally {
        slotsContainer.classList.remove("loading");
      }
    }

    window.onload = async () => {
      if (!USE_MOCK) {
        const isBackendUp = await checkBackendHealth();
        if (!isBackendUp) {
          console.warn("Backend is down, check server.py on 127.0.0.1:5001");
        }
      }
      loadSlots();
      pollingInterval = setInterval(loadSlots, 10000);
    };

    document.getElementById("refreshButton").addEventListener("click", loadSlots);

    window.onbeforeunload = () => {
      if (pollingInterval) clearInterval(pollingInterval);
    };
  </script>
</body>
</html>
